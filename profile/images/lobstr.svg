<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 66 66">
  <!-- The lobstr.io favicon (Sasha, 13/10, option J): one open pincer, red, with the ink line and the hard
       ink offset. In a dark browser the line and the offset turn white, or they would vanish on a dark tab. -->
  <style>
    .ink { fill: #0A2540; }
    .line { stroke: #0A2540; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #FFFFFF; }
      .line { stroke: #FFFFFF; }
    }
  </style>
  <path class="ink" transform="translate(4 4)" d="M30 58 C14 58 4 46 4 31 C4 15 15 4 30 4 L36 4 L27 24 L52 12 C57 18 60 25 60 32 C60 47 47 58 30 58 Z"/>
  <path class="line" fill="#FF0000" stroke-width="4" stroke-linejoin="round" d="M30 58 C14 58 4 46 4 31 C4 15 15 4 30 4 L36 4 L27 24 L52 12 C57 18 60 25 60 32 C60 47 47 58 30 58 Z"/>
</svg>
